# Nested doc-build project: requires doc-gen4 plus the two libraries, so the doc tooling (and its
# dependencies) never appears in the library's own manifest or in consumers' builds. `packagesDir`
# points back at the parent's package directory so Mathlib is shared, not re-resolved: docs are
# generated against exactly the Mathlib revision the parent pins. Built through the fork's `docs`
# facet (`lake build Hironaka:docs HironakaExamples:docs` here) by scripts/build_docs.py;
# docs/references.bib is a symlink to the parent's.
name = "docbuild"
reservoir = false
version = "0.1.0"
packagesDir = "../.lake/packages"
defaultTargets = []

[[require]]
name = "hironaka"
path = "../"

# The resolution doc-gen4 fork (emits only this repository's modules and links Mathlib and core references
# out to the hosted mathlib4_docs; see RESOLUTION_FORK.md in the fork). Pinned to a commit on top of its
# `resolution/v4.35.0` branch, which must match the parent's toolchain: after a toolchain bump, re-pin to
# the fork's branch for the new version and re-run `lake update doc-gen4` in this directory.
[[require]]
name = "doc-gen4"
git = "https://github.com/resolutionorg/doc-gen4"
rev = "01573c9920429565c3f9e8a72f142c38eba4f3b1"

# Mathlib LAST so its transitive dependency pins win, keeping the shared package directory valid.
# Keep this rev in sync with the parent lakefile.toml's Mathlib pin.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

