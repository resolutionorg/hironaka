# The blueprint: a reference-only Verso document over the library (see README.md).
# Nested Lake package; `lake exe vbp build` from this directory writes _out/site/html-multi.
name = "Blueprint"
defaultTargets = ["Blueprint"]
# Share the parent's dependency checkouts (Mathlib and the rest) instead of cloning them again.
packagesDir = "../.lake/packages"

[leanOptions]
experimental.module = true

# The library this document describes: the enclosing package, built in place.
[[require]]
name = "hironaka"
path = ".."

# VersoBlueprint is the Timaeus fork of leanprover/verso-blueprint (toolchain v4.34.0, the
# annotation directives, the annotation boxes taken from docstrings with the review ledger
# `reviews.json`, and the external-declaration rendering). Its verso patches are not needed by
# this blueprint and are not applied.
# Branch `timaeus/v4.34.0`, the fork's branch for this toolchain, pinned by commit.
[[require]]
name = "VersoBlueprint"
git = "https://github.com/timaeus-research/verso-blueprint.git"
rev = "aabc09fd28e763cb6f53f573da4ff12643bb3e33"

# Mathlib LAST so its transitive dependency pins win over VersoBlueprint's (Verso pins a different
# plausible), keeping the shared package directory valid. Keep this rev in sync with the parent
# lakefile.toml's Mathlib pin.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

# The bibliography of the library, read by `Blueprint.References` when it is compiled.
[[input_file]]
name = "references"
path = "../references.bib"
text = true

[[lean_lib]]
name = "BlueprintReferences"
roots = ["Blueprint.References"]
needs = ["references"]

[[lean_lib]]
name = "Blueprint"
