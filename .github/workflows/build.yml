# Continuous integration of this repository: builds the three libraries, runs every check of the
# package, builds the blueprint and the API documentation, and on main publishes the two as the
# documentation site on GitHub Pages. comparator.yml checks the main theorems with leanprover/comparator.
# Paths are relative to the repository root, the directory of lakefile.toml.
#
# Each step is a command that can also be run by hand from a checkout. The build directory
# `.lake/build` is cached between runs, keyed by the toolchain and the dependency lock, so a push
# rebuilds only the modules it affects; Mathlib comes from its own cache (`lake exe cache get`).
# Actions are pinned by commit, tools by version.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A new push to a pull request cancels its running checks; runs on main always complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Runs steps with `bash -eo pipefail`, so a failure on the left of a pipe fails the step.
    shell: bash

env:
  ELAN_VERSION: v4.2.4
  PYYAML_VERSION: 6.0.3

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # A standard runner has about 14 GB of free disk: tight for the Mathlib build directory,
      # this package's and a toolchain.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # For scripts/check_formalization_yaml.py.
      - name: Install PyYAML
        run: python3 -m pip install "pyyaml==$PYYAML_VERSION"

      - name: Install elan
        run: |
          curl -sSfL "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Layer check
        run: python3 scripts/check_layers.py

      - name: Copyright headers and module docstrings
        run: python3 scripts/check_header.py

      - name: references.bib lists the cited sources, and the blueprint's list is current
        run: python3 scripts/check_references.py

      - name: Restore the build directory
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: The root modules import every module
        run: |
          lake exe mk_all --lib Hironaka --check
          lake exe mk_all --lib HironakaExamples --check

      - name: Build
        run: lake build Hironaka HironakaExamples Challenge

      # Saved as soon as the build succeeds, so that a failing check below does not discard it.
      - name: Save the build directory
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - name: The Challenge files and comparator.json agree
        run: lake lean scripts/check_challenge.lean

      - name: The statement vocabulary is in the Defs files
        run: lake lean scripts/check_defs.lean

      - name: Axiom audit
        run: lake lean scripts/check_axioms.lean

      - name: The blueprint covers the statement vocabulary
        run: lake lean scripts/check_blueprint.lean

      - name: The sources of formalization.yaml are entries of references.bib
        run: python3 scripts/check_formalization_yaml.py formalization.yaml

      - name: The generated regions of formalization.yaml are current
        run: FORMALIZATION_CHECK=1 lake lean scripts/sync_formalization.lean

  blueprint:
    name: Blueprint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSfL "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The build directory that the build job saved for this commit.
      - name: Restore the build directory
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: Build the library
        run: lake build Hironaka

      # The blueprint is a nested Lake package that shares the parent's dependency checkouts
      # (`packagesDir`); Lake fetches its other dependencies, VersoBlueprint among them (required
      # by git URL in blueprint/lakefile.toml), at the commits of its lock file.
      - name: Build the blueprint
        working-directory: blueprint
        run: lake exe vbp build

      - name: The dependency locks are unchanged
        run: git diff --exit-code -- lake-manifest.json blueprint/lake-manifest.json

      - name: The site is complete
        run: |
          test -s blueprint/_out/site/html-multi/index.html
          test -s blueprint/_out/site/html-multi/-verso-data/blueprint-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blueprint
          path: blueprint/_out/site/html-multi
          if-no-files-found: error
          retention-days: 14

  # The API documentation: scripts/build_docs.py builds it through the doc-gen4 fork that
  # docbuild/ pins. Built for main, where the site is published from.
  docs:
    name: API documentation
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSfL "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore the build directory
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: Build the API documentation
        run: python3 scripts/build_docs.py _site/docs

      - name: The dependency locks are unchanged
        run: git diff --exit-code -- lake-manifest.json docbuild/lake-manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: _site/docs
          if-no-files-found: error
          retention-days: 14

  # The site: the landing page, docs/ and blueprint/, deployed to GitHub Pages from the run (the
  # repository's Pages source is "GitHub Actions"; no gh-pages branch).
  site:
    name: Publish the site
    needs: [docs, blueprint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: _site/docs

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blueprint
          path: _site/blueprint

      - name: Assemble the site
        run: python3 scripts/build_site.py --skip-docs --skip-blueprint

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
